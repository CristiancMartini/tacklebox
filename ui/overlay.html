<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tacklebox Overlay</title>
<style>
  :root {
    --title: #12161e; --bg: #1a2029; --panel: #20262f; --panel-2: #262d38; --line: #2a323f; --border: #323c4b; --border-2: #3b4658;
    --text: #e3e8ef; --text-2: #c3cbd7; --muted: #8793a6; --faint: #5d687a;
    --accent: #1e9ee0; --accent-h: #31aeee; --accent-soft: rgba(30,158,224,.15);
    --green: #3fbf7f; --yellow: #e2a83a;
    --r0: #8a94a3; --r1: #c58a5a; --r2: #b9c4cf; --r3: #e4b53c; --r4: #6fd3f2; --r5: #c38bff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 12.5px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--bg); border: 1px solid #0b0e13;
         display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  .head { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 10px; background: var(--title); border-bottom: 1px solid #0c0f15; cursor: move; }
  .mark { width: 20px; height: 20px; border-radius: 5px; background: var(--accent); display: grid; place-items: center; flex: none; }
  .head b { font-size: 13px; font-weight: 700; }
  .livetag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .head select { margin-left: auto; max-width: 150px; background: #1b212b; border: 1px solid var(--border-2); border-radius: 3px; padding: 2px 5px; font-size: 12px; outline: none; cursor: pointer; }
  .x { width: 28px; height: 28px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; border-radius: 3px; flex: none; }
  .x:hover { background: #262e3a; color: var(--text); }

  .card { flex: none; padding: 9px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .k { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; }
  .mission .t1 { font-weight: 600; font-size: 13px; margin-top: 1px; }
  .mission .obj { display: flex; gap: 7px; color: var(--text-2); margin-top: 2px; }
  .mission .obj::before { content: ""; width: 6px; height: 6px; margin-top: 6px; border-radius: 1px; transform: rotate(45deg); background: var(--yellow); flex: none; }
  .mission .goal { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
  .mission .goal b { color: #f2c94c; font-size: 14px; font-variant-numeric: tabular-nums; }
  .mission .goal svg { flex: none; transition: transform .3s; }
  .mission .tv { margin-top: 4px; font-size: 11.5px; color: #9fd3f1; }
  .mini { flex: none; position: relative; height: 150px; background: #141920; border-bottom: 1px solid var(--line); }
  .mini canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .strip { flex: none; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .compass { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .compass svg { transition: transform .3s; }
  .strip .mid { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .mid b { color: var(--text); font-weight: 600; }
  .today { text-align: right; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .today b { color: var(--text); font-size: 13px; }

  .filters { flex: none; display: flex; gap: 5px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .f { border: 1px solid var(--border-2); background: #222934; color: var(--text-2); padding: 2px 9px; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .f.on { border-color: var(--accent); background: var(--accent-soft); color: #fff; }

  .list { flex: 1; min-height: 0; overflow-y: auto; }
  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb { background: #353f4f; border-radius: 8px; border: 2px solid var(--bg); }
  .sep { padding: 5px 12px; font-size: 10.5px; font-weight: 600; color: var(--muted); background: var(--panel-2); text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--line); }
  .fish { border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 9px; padding: 5px 10px 5px 8px; cursor: pointer; }
  .row:hover { background: #222934; }
  .fish.open > .row { background: #242c38; }
  .thumb { width: 64px; height: 34px; flex: none; position: relative; display: grid; place-items: center; }
  .thumb img { width: 64px; height: 34px; object-fit: contain; }
  .thumb.no img { opacity: .45; filter: grayscale(.6); }
  .rk { position: absolute; left: 0; top: 2px; width: 8px; height: 8px; border-radius: 2px; transform: rotate(45deg); border: 1.5px solid #11151b; }
  .g { flex: 1; min-width: 0; }
  .t1 { font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 5px; }
  .s { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s em { font-style: normal; color: #9fd3f1; }
  .when { display: inline-flex; color: var(--muted); }
  .when.dia { color: #e9c46a; } .when.noite { color: #9db4ff; }
  .go { flex: none; text-align: right; min-width: 58px; font-size: 11.5px; color: var(--text-2); display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .go b { font-weight: 600; }
  .go svg { flex: none; transition: transform .3s; }

  .det { padding: 2px 12px 11px 12px; }
  .photo { height: 110px; display: grid; place-items: center; margin: 2px 0 4px; }
  .photo img { max-width: 100%; max-height: 110px; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; margin: 2px 0 6px; font-size: 11.5px; }
  .kv span { color: var(--muted); } .kv b { color: var(--text-2); font-weight: 600; }
  .lbl { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; margin: 9px 0 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { padding: 1px 7px; border-radius: 3px; background: #1e2530; border: 1px solid var(--border-2); color: var(--text-2); font-size: 11.5px; }
  .chip.fav { border-color: rgba(49,174,238,.65); background: var(--accent-soft); color: #fff; }
  .chip.weak { color: var(--muted); border-color: var(--border); background: transparent; }
  .chip small { color: var(--muted); font-size: 10.5px; margin-left: 3px; }
  .lure { display: flex; gap: 6px; align-items: baseline; font-size: 11.5px; padding: 1px 0; }
  .lure b { color: var(--text); font-weight: 600; min-width: 74px; }
  .lure span { color: var(--muted); }
  .lure.fav b { color: #9fd3f1; }
  .spot { display: grid; grid-template-columns: 22px 1fr auto; gap: 7px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 11.5px; }
  .spot:last-child { border-bottom: 0; }
  .spot .d { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .tag { font-size: 10.5px; font-weight: 600; padding: 0 5px; border-radius: 3px; border: 1px solid var(--border-2); color: var(--text-2); }
  .tag.missao { color: #9fd3f1; border-color: rgba(49,174,238,.5); }
  .tag.lendario { color: var(--r5); border-color: rgba(195,139,255,.5); }
  .tag.voce { color: var(--green); border-color: rgba(63,191,127,.5); }
  .empty { padding: 14px 12px; color: var(--faint); }
  .foot { flex: none; padding: 6px 12px; border-top: 1px solid var(--border); background: var(--title); color: var(--faint); font-size: 11px; display: flex; gap: 6px; align-items: center; }
  kbd { font: 600 10.5px "Segoe UI", sans-serif; padding: 0 5px; border-radius: 3px; background: #1b212b; border: 1px solid var(--border-2); color: var(--text-2); }
</style>
</head>
<body>
<div class="head" id="head">
  <div class="mark"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M3 9h18v11H3zM8 9V5h8v4M3 13h18M11 13v3h2v-3"/></svg></div>
  <b>Tacklebox</b>
  <span class="livetag" id="livetag"><span class="dot"></span><span>—</span></span>
  <select id="reserve" title="Reserva"></select>
  <button class="x" id="hide" title="Esconder (Ctrl+Shift+G)"><svg width="11" height="11" viewBox="0 0 11 11"><path d="M1 1l9 9M10 1l-9 9" stroke="currentColor" stroke-width="1.3"/></svg></button>
</div>
<div class="card mission" id="mission"></div>
<div class="mini" id="mini" style="display:none"><canvas id="miniCanvas"></canvas></div>
<div class="strip" id="strip"></div>
<div class="filters" id="filters">
  <button class="f on" data-f="aqui">Aqui</button>
  <button class="f" data-f="todos">Todos</button>
  <button class="f" data-f="faltam">Faltam</button>
  <button class="f" data-f="lendarios">Lendários</button>
</div>
<div class="list" id="list"><div class="empty">Lendo as tabelas do jogo…</div></div>
<div class="foot"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>G</kbd> mostra e esconde · arraste pelo topo</div>

<script>
const $ = (s) => document.querySelector(s);
const RANKS = ["Juvenil", "Bronze", "Prata", "Ouro", "Diamante", "Lendário"];
const RANKC = ["var(--r0)", "var(--r1)", "var(--r2)", "var(--r3)", "var(--r4)", "var(--r5)"];
const DIRS = ["N", "NE", "L", "SE", "S", "SO", "O", "NO"];
const SUN = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
const MOON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
const arrow = (deg, size = 14, color = "currentColor") => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="transform:rotate(${Math.round(deg)}deg)"><path d="M12 2 19 21l-7-4-7 4z" fill="${color}"/></svg>`;
const KIND = { missao: "Missão", desafio: "Desafio", lendario: "Lendário", voce: "Você pegou" };

let guide = null, stats = null, live = { ok: false }, thumbs = {}, photos = {}, mine = [];
let filter = "aqui", open = "", choice = "auto";

const nf = (v, d = 0) => (v || 0).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const kg = (v) => v >= 0.9995 ? nf(v, 2) + " kg" : nf(v * 1000) + " g";
const dist = (m) => m >= 1000 ? nf(m / 1000, 1) + " km" : nf(Math.round(m / 10) * 10) + " m";
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const range = (a, b, u) => a === b ? nf(a, a % 1 ? 1 : 0) + u : `${nf(a, a % 1 ? 1 : 0)}–${nf(b, b % 1 ? 1 : 0)}${u}`;
const topRank = (s) => { let t = -1; (s && s.byRank || []).forEach((v, i) => { if (v) t = i; }); return t; };
const cardinal = (deg) => DIRS[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const bearing = (x, z) => (Math.atan2(x - live.x, -(z - live.z)) * 180 / Math.PI + 360) % 360;
const rankRange = (s) => s.rankMin < 0 ? "" : s.rankMin === s.rankMax || s.rankMax < 0 ? RANKS[s.rankMin] : `${RANKS[s.rankMin]}–${RANKS[s.rankMax]}`;
function ago(ts) {
  const d = Date.now() / 1000 - ts;
  if (d < 60) return "agora";
  if (d < 3600) return "há " + Math.floor(d / 60) + " min";
  if (d < 86400) return "há " + Math.floor(d / 3600) + " h";
  return "há " + Math.floor(d / 86400) + " d";
}

$("#head").addEventListener("mousedown", (e) => { if (e.button === 0 && !e.target.closest("button,select")) ovWin("drag"); });
$("#hide").onclick = () => ovWin("hide");
document.addEventListener("contextmenu", (e) => e.preventDefault());
$("#reserve").onchange = (e) => { choice = e.target.value; open = ""; render(); };
$("#filters").onclick = (e) => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".f").forEach(x => x.classList.toggle("on", x === b));
  render();
};
$("#list").onclick = (e) => {
  const r = e.target.closest(".row"); if (!r) return;
  const id = r.parentElement.dataset.id;
  open = open === id ? "" : id;
  if (open) {
    const f = reserve().fish.find(x => x.id === open);
    if (f && !photos[f.icon]) requestPhoto(f.icon);
  }
  render();
};

const lastCatch = () => stats && stats.ok && (stats.catches || [])[0];
function world() {
  if (choice !== "auto") return choice;
  if (live.ok && live.world) return live.world;
  const c = lastCatch();
  return c ? c.world : guide && guide.reserves[0] && guide.reserves[0].world;
}
const reserve = () => guide.reserves.find(r => r.world === world()) || guide.reserves[0];
const here = () => live.ok && (!live.world || live.world === world());

// corpos d'água que contêm o jogador (ou o mais próximo, se ele estiver em terra)
function watersHere(res) {
  if (!here()) return [];
  let best = null, bestD = Infinity;
  const inside = [];
  for (const w of res.waters) {
    const dx = live.x - w.x, dz = live.z - w.z;
    const lx = dx * w.ax + dz * w.az, lz = -dx * w.az + dz * w.ax;
    const d = Math.hypot(Math.max(0, Math.abs(lx) - w.hx), Math.max(0, Math.abs(lz) - w.hz));
    if (d === 0) inside.push(w);
    if (d < bestD) { bestD = d; best = w; }
  }
  return inside.length ? inside : best ? [best] : [];
}

// pontos de uma espécie: os do jogo e onde você pegou (anotados pelo Tacklebox)
function spotsFor(res, f) {
  const list = res.spots.filter(s => s.fish === f.id).map(s => ({ ...s }));
  if (!f.legendary) mine.filter(c => c.world === res.world && c.speciesId === f.speciesId)
    .forEach(c => list.push({ x: c.x, z: c.z, kind: "voce", rankMin: c.rank, rankMax: c.rank, date: c.date, weight: c.weight }));
  if (here()) list.forEach(s => { s.d = Math.hypot(s.x - live.x, s.z - live.z); s.b = bearing(s.x, s.z); });
  list.sort((a, b) => (a.d ?? 0) - (b.d ?? 0));
  return list;
}

function render() {
  if (!guide) return;
  if (!guide.ok) { $("#list").innerHTML = `<div class="empty">${esc(guide.error || "Guia indisponível.")}</div>`; return; }
  const res = reserve();

  // cabeçalho
  $("#livetag").innerHTML = live.ok ? `<span class="dot on"></span><span>ao vivo</span>` : `<span class="dot"></span><span>${esc(live.status || "jogo fechado")}</span>`;
  const auto = live.ok && live.world ? (guide.reserves.find(r => r.world === live.world) || {}).name : null;
  $("#reserve").innerHTML = `<option value="auto">${esc(auto || "Automático")}</option>` +
    guide.reserves.map(r => `<option value="${r.world}">${esc(r.name)}</option>`).join("");
  $("#reserve").value = choice;

  // missão: a da tela do jogo; sem jogo aberto, a rastreada no save
  let mName = live.ok ? live.mission : "", mObj = live.ok ? live.objective : "";
  if (!mName && stats && stats.ok) {
    const m = (stats.missions || []).find(m => m.world === res.world && m.tracked);
    if (m) { mName = m.name; const o = m.objectives.find(o => o.active); mObj = o ? o.text + (o.counter ? ` (${o.counter})` : "") : ""; }
  }
  $("#mission").style.display = mName ? "" : "none";
  const tg = here() && live.target;
  const goal = tg ? `<div class="goal">${arrow(bearing(tg.x, tg.z) - live.heading, 18, "#f2c94c")}<b>${dist(Math.hypot(tg.x - live.x, tg.z - live.z))}</b><span>até o objetivo · ${cardinal(bearing(tg.x, tg.z))}</span></div>` +
    (tg.travel ? `<div class="tv">Viagem rápida: ${esc(tg.travel)} (${dist(tg.travelDist)} do objetivo)</div>` : "") : "";
  $("#mission").innerHTML = mName ? `<div class="k">Missão</div><div class="t1">${esc(mName)}</div>${mObj ? `<div class="obj">${esc(mObj)}</div>` : ""}${goal}` : "";
  drawMini(res);

  // faixa: direção, peixes aqui e capturas de hoje
  const idx = {};
  if (stats && stats.ok) (stats.species || []).forEach(s => { if (s.world === res.world) idx[s.speciesId] = s; });
  const ws = watersHere(res);
  const hereIds = new Set(ws.flatMap(w => w.fish));
  const hereFish = res.fish.filter(f => hereIds.has(f.id));
  const missing = hereFish.filter(f => !(idx[f.speciesId] || {}).caught).length;
  const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  const today = stats && stats.ok ? (stats.catches || []).filter(c => c.date * 1000 >= midnight.getTime()) : [];
  const best = today.reduce((a, c) => !a || c.weight > a.weight ? c : a, null);
  $("#strip").innerHTML = `
    <div class="compass">${here() ? arrow(live.heading, 15, "var(--accent-h)") + `<span>${cardinal(live.heading)} ${Math.round(live.heading)}°</span>` : `<span class="muted">—</span>`}</div>
    <div class="mid">${here() ? `<b>${hereFish.length}</b> espécies aqui${missing ? ` · faltam <b>${missing}</b>` : " · todas pegas"}` : esc(res.name)}</div>
    <div class="today">hoje <b>${today.length}</b>${best ? ` · ${kg(best.weight)}` : ""}</div>`;

  // lista
  const keep = (f) => filter === "todos" ? true : filter === "lendarios" ? f.legendary :
    filter === "faltam" ? !f.legendary && !(idx[f.speciesId] || {}).caught :
    here() ? hereIds.has(f.id) : !f.legendary;
  let list = res.fish.filter(keep).map(f => ({ f, sp: spotsFor(res, f) }));
  list.sort((a, b) => {
    const ca = !!(idx[a.f.speciesId] || {}).caught, cb = !!(idx[b.f.speciesId] || {}).caught;
    if (a.f.legendary !== b.f.legendary) return a.f.legendary ? 1 : -1;
    if (ca !== cb) return ca ? 1 : -1;
    return a.f.name.localeCompare(b.f.name);
  });
  const item = ({ f, sp }) => {
    const st = f.legendary ? null : idx[f.speciesId];
    const r = f.legendary ? 5 : st && st.caught ? topRank(st) : -1;
    const fav = [...f.baits.filter(b => b.tier === 0 && b.kind !== "ceva").map(b => b.name), ...f.lures.filter(l => l.tier === 0).map(l => l.name)];
    const when = f.time === "dia" ? `<span class="when dia" title="Mais ativo de dia">${SUN}</span>` : f.time === "noite" ? `<span class="when noite" title="Mais ativo à noite">${MOON}</span>` : "";
    const near = sp.find(s => s.d !== undefined);
    const go = near ? `<div class="go" title="${KIND[near.kind]} mais perto">${arrow(near.b - live.heading, 12)}<b>${dist(near.d)}</b></div>`
      : sp.length ? `<div class="go muted">${sp.length} ponto${sp.length > 1 ? "s" : ""}</div>` : "";
    const img = thumbs[f.icon];
    return `<div class="fish${open === f.id ? " open" : ""}" data-id="${esc(f.id)}">
      <div class="row" role="button" aria-label="${esc(f.name)}">
        <div class="thumb${r < 0 ? " no" : ""}">${img ? `<img src="${img}" alt="">` : ""}${r >= 0 ? `<span class="rk" style="background:${RANKC[r]}" title="${RANKS[r]}"></span>` : ""}</div>
        <div class="g"><div class="t1">${esc(f.name)} ${when}</div><div class="s">${range(f.depthMin, f.depthMax, " m")} · <em>${esc(fav.slice(0, 3).join(", ") || "—")}</em></div></div>
        ${go}
      </div>${open === f.id ? detail(f, sp, st) : ""}</div>`;
  };
  const normal = list.filter(x => !x.f.legendary), legend = list.filter(x => x.f.legendary);
  const empty = filter === "faltam" ? "Você já pegou todas as espécies daqui!" : filter === "aqui" && here() ? "Nenhum peixe neste trecho." : "Nenhum peixe neste filtro.";
  $("#list").innerHTML = list.length ? normal.map(item).join("") + (legend.length && filter !== "lendarios" ? `<div class="sep">Lendários</div>` : "") + legend.map(item).join("")
    : `<div class="empty">${empty}</div>`;
}

function detail(f, sp, st) {
  const baits = [0, 1, 2].map(t => f.baits.filter(b => b.tier === t)
    .map(b => `<span class="chip${t === 0 ? " fav" : t === 2 ? " weak" : ""}">${esc(b.name)}<small>${b.kind}</small></span>`).join("")).join("");
  const lures = f.lures.map(l => `<div class="lure${l.tier === 0 ? " fav" : ""}"><b>${esc(l.name)}</b><span>${esc(l.styles.join(", "))}</span></div>`).join("");
  const spots = sp.slice(0, 4).map(s => {
    const label = s.kind === "voce" ? `${kg(s.weight)} · ${ago(s.date)}` : rankRange(s);
    const pos = s.d !== undefined ? `<span class="d">${dist(s.d)}</span>` : `<span class="muted">${cardinal(Math.atan2(s.x, -s.z) * 180 / Math.PI)} do mapa</span>`;
    return `<div class="spot">${s.d !== undefined ? arrow(s.b - live.heading, 16, "var(--accent-h)") : `<span></span>`}
      <span><span class="tag ${s.kind}">${KIND[s.kind]}</span> ${esc(label)}</span>${pos}</div>`;
  }).join("");
  const mineTxt = st && st.caught ? `${nf(st.caught)} pego${st.caught === 1 ? "" : "s"} · maior ${kg(st.biggest.weight)}` : f.legendary ? (f.species ? esc(f.species) : "Lendário") : "Ainda não pegou";
  return `<div class="det">
    <div class="photo">${photos[f.icon] ? `<img src="${photos[f.icon]}" alt="">` : thumbs[f.icon] ? `<img src="${thumbs[f.icon]}" alt="">` : ""}</div>
    <div class="kv">
      <span>Profundidade <b>${range(f.depthMin, f.depthMax, " m")}</b></span>
      ${f.legendary ? `<span>Peso <b>${kg(f.kgMax[0])}</b></span>` : `<span>Água <b>${range(f.tempMin, f.tempMax, " °C")}</b></span>`}
      ${f.legendary ? "" : `<span>Diamante <b>${kg(f.kgMax[3])}+</b></span><span>${esc(f.current)}</span>`}
      <span style="grid-column:1/-1">${mineTxt}</span>
    </div>
    ${spots ? `<div class="lbl">Onde pegar</div>${spots}` : ""}
    ${f.habitats.length ? `<div class="lbl">Habitat</div><div class="chips">${f.habitats.map(h => `<span class="chip">${esc(h.name)}</span>`).join("")}</div>` : ""}
    <div class="lbl">Iscas</div><div class="chips">${baits || `<span class="s">nenhuma</span>`}</div>
    ${lures ? `<div class="lbl">Artificiais</div>${lures}` : ""}
    ${f.traits.length ? `<div class="lbl">Comportamento</div><div class="s" style="white-space:normal">${f.traits.map(t => esc(t.name)).join(" · ")}</div>` : ""}
  </div>`;
}

// ---------- minimapa ----------
const WORLD = 16384, M2P = 2048 / WORLD, MINIZ = 1.5;
const mapImgs = {}, mapAsked = {};
window.onMap = (m) => {
  if (!m.url) { mapImgs[m.world] = "none"; return; }
  const im = new Image();
  im.onload = () => { mapImgs[m.world] = im; render(); };
  im.src = m.url;
};
function drawMini(res) {
  const box = $("#mini");
  const img = mapImgs[res.world];
  if (!here()) { box.style.display = "none"; return; }
  if (!img) { if (!mapAsked[res.world]) { mapAsked[res.world] = 1; requestMap(res.world); } box.style.display = "none"; return; }
  if (img === "none") { box.style.display = "none"; return; }
  box.style.display = "";
  const cv = $("#miniCanvas"), dpr = window.devicePixelRatio || 1, W = box.clientWidth, H = box.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = (live.x + WORLD / 2) * M2P, cy = (live.z + WORLD / 2) * M2P;
  ctx.fillStyle = "#141920"; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2 - cx * MINIZ, H / 2 - cy * MINIZ); ctx.scale(MINIZ, MINIZ); ctx.drawImage(img, 0, 0); ctx.restore();
  const S = (x, z) => [((x + WORLD / 2) * M2P - cx) * MINIZ + W / 2, ((z + WORLD / 2) * M2P - cy) * MINIZ + H / 2];
  const inside = (p) => p[0] > 6 && p[1] > 6 && p[0] < W - 6 && p[1] < H - 6;
  const dot = (p, r, fill, stroke) => { ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.lineWidth = 1.5; ctx.strokeStyle = stroke; ctx.stroke(); } };
  const unlocked = new Set((stats && stats.ok && stats.travel) || []);
  for (const ic of res.icons) if (ic.travel) { const p = S(ic.x, ic.z); if (inside(p)) dot(p, 3.5, unlocked.has(ic.travelId) ? "#e3e8ef" : "rgba(20,25,32,.8)", unlocked.has(ic.travelId) ? "#11151b" : "#8793a6"); }
  const of = open && res.fish.find(f => f.id === open);
  if (of) for (const s of res.spots.filter(s => s.fish === of.id)) { const p = S(s.x, s.z); if (inside(p)) dot(p, 5, s.kind === "lendario" ? "#c38bff" : "#31aeee", "#0b2433"); }
  const tg = live.target;
  if (tg) {
    let p = S(tg.x, tg.z);
    if (!inside(p)) {
      // fora da tela: losango na borda, na direção do objetivo
      const dx = p[0] - W / 2, dy = p[1] - H / 2, k = Math.min((W / 2 - 10) / Math.abs(dx || 1), (H / 2 - 10) / Math.abs(dy || 1));
      p = [W / 2 + dx * k, H / 2 + dy * k];
    }
    ctx.beginPath(); ctx.moveTo(p[0], p[1] - 7); ctx.lineTo(p[0] + 7, p[1]); ctx.lineTo(p[0], p[1] + 7); ctx.lineTo(p[0] - 7, p[1]); ctx.closePath();
    ctx.fillStyle = "#f2c94c"; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = "#11151b"; ctx.stroke();
  }
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(live.heading * Math.PI / 180);
  ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(6, 7); ctx.lineTo(0, 3); ctx.lineTo(-6, 7); ctx.closePath();
  ctx.fillStyle = "#31aeee"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke(); ctx.restore();
  ctx.font = "600 10px Segoe UI"; ctx.fillStyle = "rgba(227,232,239,.7)"; ctx.fillText("N", W - 14, 14);
}

let pending = 0;
const later = () => { if (!pending) pending = setTimeout(() => { pending = 0; render(); }, 120); };
window.onGuide = (g) => { guide = g; render(); };
window.onStats = (s) => { stats = s; getMyCatches().then(m => { mine = m || []; render(); }); };
window.onLive = (l) => { live = l || { ok: false }; later(); };
window.onThumbs = (t) => { thumbs = t || {}; render(); };
window.onPhoto = (p) => { photos[p.icon] = p.url; if (open) render(); };
window.onShow = () => render();
(async () => {
  guide = await getGuide();
  stats = await getStats();
  live = (await getLive()) || { ok: false };
  thumbs = (await getThumbs()) || {};
  mine = (await getMyCatches()) || [];
  render();
  setInterval(render, 60000);
})();
</script>
