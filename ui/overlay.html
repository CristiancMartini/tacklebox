<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tacklebox Overlay</title>
<style>
  :root {
    --title: #12161e; --bg: #1a2029; --panel: #20262f; --panel-2: #262d38; --line: #2a323f; --border: #323c4b; --border-2: #3b4658;
    --text: #e3e8ef; --text-2: #c3cbd7; --muted: #8793a6; --faint: #5d687a;
    --accent: #1e9ee0; --accent-h: #31aeee; --accent-soft: rgba(30,158,224,.15);
    --green: #3fbf7f; --yellow: #e2a83a; --goal: #f2c94c;
    --r0: #8a94a3; --r1: #c58a5a; --r2: #b9c4cf; --r3: #e4b53c; --r4: #6fd3f2; --r5: #c38bff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 12.5px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--bg); border: 1px solid #0b0e13;
         display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased; cursor: default; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  .head { height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--title); border-bottom: 1px solid #0c0f15; }
  .mark { width: 18px; height: 18px; border-radius: 4px; background: var(--accent); display: grid; place-items: center; flex: none; }
  .head b { font-size: 12.5px; font-weight: 700; }
  .livetag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 2px rgba(80,200,120,.22); } /* sem animação: animar obriga o Windows a recompor a tela a cada quadro */
  .reserve { margin-left: auto; color: var(--text-2); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .card { flex: none; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .k { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; }
  .mission .t1 { font-weight: 600; font-size: 13px; margin-top: 1px; }
  .mission .obj { display: flex; gap: 7px; color: var(--text-2); margin-top: 2px; }
  .mission .obj::before { content: ""; width: 6px; height: 6px; margin-top: 6px; border-radius: 1px; transform: rotate(45deg); background: var(--yellow); flex: none; }
  .mission .goal { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
  .mission .goal b { color: var(--goal); font-size: 14px; font-variant-numeric: tabular-nums; }
  .mission .tv { margin-top: 4px; font-size: 11.5px; color: #9fd3f1; }
  .mini { flex: none; position: relative; height: 140px; background: #141920; border-bottom: 1px solid var(--line); }
  .mini canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .strip { flex: none; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .compass { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .strip .mid { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .mid b { color: var(--text); font-weight: 600; }
  .today { text-align: right; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .today b { color: var(--text); font-size: 13px; }

  .list { flex: 1; min-height: 0; overflow: hidden; }
  .sep { padding: 4px 12px; font-size: 10.5px; font-weight: 600; color: var(--muted); background: var(--panel-2); text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 8px; border-bottom: 1px solid var(--line); }
  .thumb { width: 56px; height: 30px; flex: none; position: relative; display: grid; place-items: center; }
  .thumb img { width: 56px; height: 30px; object-fit: contain; }
  .thumb.no img { opacity: .45; filter: grayscale(.6); }
  .rk { position: absolute; left: 0; top: 2px; width: 8px; height: 8px; border-radius: 2px; transform: rotate(45deg); border: 1.5px solid #11151b; }
  .g { flex: 1; min-width: 0; }
  .t1 { font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 5px; }
  .s { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s em { font-style: normal; color: #9fd3f1; }
  .when { display: inline-flex; color: var(--muted); }
  .dh { font-size: 10.5px; font-weight: 600; color: var(--r4); white-space: nowrap; }
  .s .hk { color: var(--text-2); }
  .when.dia { color: #e9c46a; } .when.noite { color: #9db4ff; }
  .go { flex: none; text-align: right; min-width: 54px; font-size: 11.5px; color: var(--text-2); display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .go b { font-weight: 600; }
  .more { padding: 5px 12px; color: var(--faint); font-size: 11px; }
  .empty { padding: 14px 12px; color: var(--faint); }
  .foot { flex: none; padding: 5px 10px; border-top: 1px solid var(--border); background: var(--title); color: var(--faint); font-size: 10.5px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  kbd { font: 600 10px "Segoe UI", sans-serif; padding: 0 4px; border-radius: 3px; background: #1b212b; border: 1px solid var(--border-2); color: var(--text-2); }
  /* modo de arrastar: com o Tacklebox aberto sobre o jogo */
  body.edit { border: 2px dashed var(--accent); cursor: move; }
  body.edit .foot { color: #fff; background: var(--accent); }
  .foot .edit-tip { display: none; }
  body.edit .foot .edit-tip { display: inline; }
  body.edit .foot .play-tip { display: none; }

  /* bordas e cantos: redimensionar */
  html.rs-ns, html.rs-ns * { cursor: ns-resize !important; }
  html.rs-ew, html.rs-ew * { cursor: ew-resize !important; }
  html.rs-nwse, html.rs-nwse * { cursor: nwse-resize !important; }
  html.rs-nesw, html.rs-nesw * { cursor: nesw-resize !important; }
</style>
</head>
<body>
<div class="head">
  <div class="mark"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M3 9h18v11H3zM8 9V5h8v4M3 13h18M11 13v3h2v-3"/></svg></div>
  <b>Tacklebox</b>
  <span class="livetag" id="livetag"><span class="dot"></span><span>—</span></span>
  <span class="reserve" id="reserve"></span>
</div>
<div class="card mission" id="mission"></div>
<div class="mini" id="mini" style="display:none"><canvas id="miniCanvas"></canvas></div>
<div class="strip" id="strip"></div>
<div class="list" id="list"><div class="empty">Lendo as tabelas do jogo…</div></div>
<div class="foot"><span class="play-tip"><kbd>Ctrl+Shift+X</kbd> esconde · <kbd>Ctrl+Shift+G</kbd> abre o Tacklebox</span><span class="edit-tip">Arraste para mover · bordas e cantos mudam o tamanho</span></div>

<script>
// Painel fixo: só mostra (o mouse atravessa a janela). Para interagir, Ctrl+Shift+G abre o Tacklebox.
const $ = (s) => document.querySelector(s);
const RANKS = ["Juvenil", "Bronze", "Prata", "Ouro", "Diamante", "Lendário"];
const RANKC = ["var(--r0)", "var(--r1)", "var(--r2)", "var(--r3)", "var(--r4)", "var(--r5)"];
const DIRS = ["N", "NE", "L", "SE", "S", "SO", "O", "NO"];
const SUN = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
const MOON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
const arrow = (deg, size = 14, color = "currentColor") => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="transform:rotate(${Math.round(deg)}deg)"><path d="M12 2 19 21l-7-4-7 4z" fill="${color}"/></svg>`;
const MAXROWS = 9;
// anzóis: faixa que pega o peixe e a faixa em que só os maiores mordem
const hookLabel = (i) => i <= 10 ? String(11 - i) : (i - 10) + "/0";
function hookSummary(f) {
  const hs = f.hooks || [];
  if (!hs.length) return null;
  const rng = (a, b) => a.index === b.index ? a.size : a.size + "–" + b.size;
  const minRank = (h) => Math.min(...h.ranks);
  const top = Math.max(...hs.map(minRank));
  const topHooks = hs.filter(h => minRank(h) === top);
  return { all: rng(hs[0], hs[hs.length - 1]), top, topRange: topHooks.length && top > 0 && topHooks.length < hs.length ? rng(topHooks[0], topHooks[topHooks.length - 1]) : "" };
}


let guide = null, stats = null, live = { ok: false }, thumbs = {}, mine = [];

const nf = (v, d = 0) => (v || 0).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const kg = (v) => v >= 0.9995 ? nf(v, 2) + " kg" : nf(v * 1000) + " g";
const dist = (m) => m >= 1000 ? nf(m / 1000, 1) + " km" : nf(Math.round(m / 10) * 10) + " m";
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const range = (a, b, u) => a === b ? nf(a, a % 1 ? 1 : 0) + u : `${nf(a, a % 1 ? 1 : 0)}–${nf(b, b % 1 ? 1 : 0)}${u}`;
const topRank = (s) => { let t = -1; (s && s.byRank || []).forEach((v, i) => { if (v) t = i; }); return t; };
const cardinal = (deg) => DIRS[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const bearing = (x, z) => (Math.atan2(x - live.x, -(z - live.z)) * 180 / Math.PI + 360) % 360;
document.addEventListener("contextmenu", (e) => e.preventDefault());
// arrastar: só no modo de edição (no jogo o mouse atravessa o painel)
document.addEventListener("mousedown", (e) => { if (e.button === 0 && document.body.classList.contains("edit")) ovWin("drag"); });
window.onEdit = (on) => document.body.classList.toggle("edit", !!on);
// bordas e cantos: redimensionar a janela (a janela não tem moldura do Windows)
(function () {
  const M = 6;
  const CUR = { t: "ns", b: "ns", l: "ew", r: "ew", tl: "nwse", br: "nwse", tr: "nesw", bl: "nesw" };
  const edgeAt = (x, y) => {
    let e = "";
    if (y < M) e += "t"; else if (y > innerHeight - M) e += "b";
    if (x < M) e += "l"; else if (x > innerWidth - M) e += "r";
    return e;
  };
  const setCursor = (ed) => {
    const h = document.documentElement;
    h.classList.remove("rs-ns", "rs-ew", "rs-nwse", "rs-nesw");
    if (ed) h.classList.add("rs-" + CUR[ed]);
  };
  document.addEventListener("mousemove", (e) => setCursor(document.body.classList.contains("edit") && e.buttons === 0 ? edgeAt(e.clientX, e.clientY) : ""), true);
  document.addEventListener("mouseleave", () => setCursor(""));
  document.addEventListener("mousedown", (e) => {
    if (e.button !== 0 || !(document.body.classList.contains("edit"))) return;
    const ed = edgeAt(e.clientX, e.clientY);
    if (!ed) return;
    e.preventDefault(); e.stopPropagation();
    ovWin("resize:" + ed);
  }, true);
})();


const lastCatch = () => stats && stats.ok && (stats.catches || [])[0];
function world() {
  if (live.ok && live.world) return live.world;
  const c = lastCatch();
  return c ? c.world : guide && guide.reserves[0] && guide.reserves[0].world;
}
const reserve = () => guide.reserves.find(r => r.world === world()) || guide.reserves[0];
const here = () => live.ok && !!live.world;

// corpos d'água que contêm o jogador (ou o mais próximo, se ele estiver em terra)
function watersHere(res) {
  if (!here()) return [];
  let best = null, bestD = Infinity;
  const inside = [];
  for (const w of res.waters) {
    const dx = live.x - w.x, dz = live.z - w.z;
    const lx = dx * w.ax + dz * w.az, lz = -dx * w.az + dz * w.ax;
    const d = Math.hypot(Math.max(0, Math.abs(lx) - w.hx), Math.max(0, Math.abs(lz) - w.hz));
    if (d === 0) inside.push(w);
    if (d < bestD) { bestD = d; best = w; }
  }
  return inside.length ? inside : best ? [best] : [];
}

// ponto mais perto da espécie: os marcados pelo jogo e onde você já pegou
function nearestSpot(res, f) {
  if (!here()) return null;
  let best = null;
  const consider = (x, z) => { const d = Math.hypot(x - live.x, z - live.z); if (!best || d < best.d) best = { d, b: bearing(x, z) }; };
  res.spots.forEach(s => { if (s.fish === f.id) consider(s.x, s.z); });
  if (!f.legendary) mine.forEach(c => { if (c.world === res.world && c.speciesId === f.speciesId) consider(c.x, c.z); });
  return best;
}

// setHTML só mexe no elemento se o conteúdo mudou: cada mudança faz o painel ser
// redesenhado por cima do jogo, então nada é refeito à toa
const setHTML = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } };

function render() {
  if (!guide) return;
  if (!guide.ok) { setHTML($("#list"), `<div class="empty">${esc(guide.error || "Guia indisponível.")}</div>`); return; }
  const res = reserve();
  setHTML($("#livetag"), live.ok ? `<span class="dot on"></span><span>ao vivo</span>` : `<span class="dot"></span><span>${esc(live.status || "jogo fechado")}</span>`);
  $("#reserve").textContent = res.name;

  // missão: a da tela do jogo; sem jogo aberto, a rastreada no save
  let mName = live.ok ? live.mission : "", mObj = live.ok ? live.objective : "";
  if (!mName && stats && stats.ok) {
    const m = (stats.missions || []).find(m => m.world === res.world && m.tracked);
    if (m) { mName = m.name; const o = m.objectives.find(o => o.active); mObj = o ? o.text + (o.counter ? ` (${o.counter})` : "") : ""; }
  }
  const tg = here() && live.target;
  const goal = tg ? `<div class="goal">${arrow(bearing(tg.x, tg.z) - live.heading, 18, "var(--goal)")}<b>${dist(Math.hypot(tg.x - live.x, tg.z - live.z))}</b><span>até o objetivo · ${cardinal(bearing(tg.x, tg.z))}</span></div>` +
    (tg.travel ? `<div class="tv">Viagem rápida: ${esc(tg.travel)} (${dist(tg.travelDist)} do objetivo)</div>` : "") : "";
  $("#mission").style.display = mName ? "" : "none";
  setHTML($("#mission"), mName ? `<div class="k">Missão</div><div class="t1">${esc(mName)}</div>${mObj ? `<div class="obj">${esc(mObj)}</div>` : ""}${goal}` : "");
  drawMini(res);

  // faixa: direção, peixes aqui e capturas de hoje
  const idx = {};
  if (stats && stats.ok) (stats.species || []).forEach(s => { if (s.world === res.world) idx[s.speciesId] = s; });
  const hereIds = new Set(watersHere(res).flatMap(w => w.fish));
  const pool = res.fish.filter(f => here() ? hereIds.has(f.id) : !f.legendary);
  const missing = pool.filter(f => !(idx[f.speciesId] || {}).caught).length;
  const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  const today = stats && stats.ok ? (stats.catches || []).filter(c => c.date * 1000 >= midnight.getTime()) : [];
  const best = today.reduce((a, c) => !a || c.weight > a.weight ? c : a, null);
  setHTML($("#strip"), `
    <div class="compass">${here() ? arrow(live.heading, 14, "var(--accent-h)") + `<span>${cardinal(live.heading)} ${Math.round(live.heading)}°</span>` : `<span class="muted">—</span>`}</div>
    <div class="mid"><b>${pool.length}</b> espécies ${here() ? "aqui" : "na reserva"}${missing ? ` · faltam <b>${missing}</b>` : " · todas pegas"}</div>
    <div class="today">hoje <b>${today.length}</b>${best ? ` · ${kg(best.weight)}` : ""}</div>`);

  // peixes: os que faltam primeiro, depois o ponto mais perto
  const list = pool.map(f => ({ f, st: idx[f.speciesId], sp: nearestSpot(res, f) }));
  list.sort((a, b) => {
    const ca = !!(a.st || {}).caught, cb = !!(b.st || {}).caught;
    if (ca !== cb) return ca ? 1 : -1;
    if (a.sp && b.sp) return a.sp.d - b.sp.d;
    return a.f.name.localeCompare(b.f.name);
  });
  const rowHtml = ({ f, st, sp }, k) => {
    const r = st && st.caught ? topRank(st) : -1;
    const fav = [...f.baits.filter(b => b.tier === 0 && b.kind !== "ceva").map(b => b.name), ...f.lures.filter(l => l.tier === 0).map(l => l.name)];
    const when = f.time === "dia" ? `<span class="when dia">${SUN}</span>` : f.time === "noite" ? `<span class="when noite">${MOON}</span>` : "";
    const img = thumbs[f.icon];
    const hk = hookSummary(f);
    return `<div class="row">
      <div class="thumb${r < 0 ? " no" : ""}">${img ? `<img src="${img}" alt="">` : ""}${r >= 0 ? `<span class="rk" style="background:${RANKC[r]}"></span>` : ""}</div>
      <div class="g"><div class="t1">${esc(f.name)} ${when}${hk && hk.topRange ? ` <span class="dh" title="Nestes anzóis só ${RANKS[hk.top]} morde">◆ ${hk.topRange}</span>` : ""}</div><div class="s">${range(f.depthMin, f.depthMax, " m")}${hk ? ` · <span class="hk">anzol ${hk.all}</span>` : ""} · <em>${esc(fav.slice(0, 3).join(", ") || "—")}</em></div></div>
      ${sp ? `<div class="go" data-go="${k}"></div>` : ""}</div>`;
  };
  // as linhas (com as fotos) só são refeitas quando muda quem aparece ou a ordem;
  // seta e distância de cada uma são atualizadas à parte
  const rows = list.slice(0, MAXROWS);
  const box = $("#list");
  setHTML(box, rows.length ? rows.map(rowHtml).join("") + (list.length > MAXROWS ? `<div class="more">+${list.length - MAXROWS} no Tacklebox (Ctrl+Shift+G)</div>` : "")
    : `<div class="empty">Nenhum peixe neste trecho.</div>`);
  rows.forEach(({ sp }, k) => {
    const el = sp && box.querySelector(`[data-go="${k}"]`);
    if (el) setHTML(el, `${arrow(sp.b - live.heading, 12)}<b>${dist(sp.d)}</b>`);
  });
}

// ---------- minimapa ----------
const WORLD = 16384, M2P = 2048 / WORLD, MINIZ = 1.5;
const mapImgs = {}, mapAsked = {};
window.onMap = (m) => {
  if (!m.url) { mapImgs[m.world] = "none"; return; }
  const im = new Image();
  im.onload = () => { mapImgs[m.world] = im; render(); };
  im.src = m.url;
};
function drawMini(res) {
  const box = $("#mini");
  const img = mapImgs[res.world];
  if (!here()) { box.style.display = "none"; return; }
  if (!img) { if (!mapAsked[res.world]) { mapAsked[res.world] = 1; requestMap(res.world); } box.style.display = "none"; return; }
  if (img === "none") { box.style.display = "none"; return; }
  box.style.display = "";
  const cv = $("#miniCanvas"), dpr = window.devicePixelRatio || 1, W = box.clientWidth, H = box.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = (live.x + WORLD / 2) * M2P, cy = (live.z + WORLD / 2) * M2P;
  ctx.fillStyle = "#141920"; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2 - cx * MINIZ, H / 2 - cy * MINIZ); ctx.scale(MINIZ, MINIZ); ctx.drawImage(img, 0, 0); ctx.restore();
  const S = (x, z) => [((x + WORLD / 2) * M2P - cx) * MINIZ + W / 2, ((z + WORLD / 2) * M2P - cy) * MINIZ + H / 2];
  const inside = (p) => p[0] > 6 && p[1] > 6 && p[0] < W - 6 && p[1] < H - 6;
  const dot = (p, r, fill, stroke) => { ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.lineWidth = 1.5; ctx.strokeStyle = stroke; ctx.stroke(); } };
  const unlocked = new Set((stats && stats.ok && stats.travel) || []);
  for (const ic of res.icons) if (ic.travel) { const p = S(ic.x, ic.z); if (inside(p)) dot(p, 3.5, unlocked.has(ic.travelId) ? "#e3e8ef" : "rgba(20,25,32,.8)", unlocked.has(ic.travelId) ? "#11151b" : "#8793a6"); }
  const tg = live.target;
  if (tg) {
    let p = S(tg.x, tg.z);
    if (!inside(p)) {
      const dx = p[0] - W / 2, dy = p[1] - H / 2, k = Math.min((W / 2 - 10) / Math.abs(dx || 1), (H / 2 - 10) / Math.abs(dy || 1));
      p = [W / 2 + dx * k, H / 2 + dy * k];
    }
    ctx.beginPath(); ctx.moveTo(p[0], p[1] - 7); ctx.lineTo(p[0] + 7, p[1]); ctx.lineTo(p[0], p[1] + 7); ctx.lineTo(p[0] - 7, p[1]); ctx.closePath();
    ctx.fillStyle = "#f2c94c"; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = "#11151b"; ctx.stroke();
  }
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(live.heading * Math.PI / 180);
  ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(6, 7); ctx.lineTo(0, 3); ctx.lineTo(-6, 7); ctx.closePath();
  ctx.fillStyle = "#31aeee"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke(); ctx.restore();
  ctx.font = "600 10px Segoe UI"; ctx.fillStyle = "rgba(227,232,239,.7)"; ctx.fillText("N", W - 14, 14);
}

let pending = 0;
const later = () => { if (!pending) pending = setTimeout(() => { pending = 0; render(); }, 120); };
window.onGuide = (g) => { guide = g; render(); };
window.onStats = (s) => { stats = s; getMyCatches().then(m => { mine = m || []; render(); }); };
window.onLive = (l) => { live = l || { ok: false }; later(); };
window.onThumbs = (t) => { thumbs = t || {}; render(); };
window.onShow = () => render();
(async () => {
  guide = await getGuide();
  stats = await getStats();
  live = (await getLive()) || { ok: false };
  thumbs = (await getThumbs()) || {};
  mine = (await getMyCatches()) || [];
  render();
  setInterval(render, 60000);
})();
</script>
</body>
